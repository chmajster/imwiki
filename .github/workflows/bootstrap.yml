name: Bootstrap final imWiki source

on:
  push:
    branches:
      - feature/production-foundation
    paths:
      - bootstrap-source.tgz.b64
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-foundation
          fetch-depth: 0
      - name: Verify and unpack final source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import string

          raw = Path('bootstrap-source.tgz.b64').read_text()
          allowed = set(string.ascii_letters + string.digits + '+/=\r\n\t ')
          bad = [(i, ch) for i, ch in enumerate(raw) if ch not in allowed]
          print('length=', len(raw), 'bad_count=', len(bad))
          for i, ch in bad[:20]:
              lo=max(0,i-60); hi=min(len(raw),i+61)
              print('bad', i, repr(ch), repr(raw[lo:hi]))
          if bad:
              raise SystemExit(2)
          PY
      - name: Commit final repository source
        if: ${{ false }}
        shell: bash
        run: echo diagnostics-only

