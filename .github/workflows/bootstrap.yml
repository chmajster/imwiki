name: Bootstrap final imWiki source

on:
  push:
    branches:
      - feature/production-foundation
    paths:
      - bootstrap-source.tgz.b64
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-foundation
          fetch-depth: 0
      - name: Verify and unpack final source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/imwiki-source.tgz
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n+1))
            [ -z "$line" ] && continue
            if ! printf '%s' "$line" | base64 -d >> /tmp/imwiki-source.tgz 2>/tmp/b64.err; then
              echo "Invalid base64 at line $n"
              printf 'head=%s\n' "${line:0:80}"
              len=${#line}
              if [ "$len" -gt 80 ]; then printf 'tail=%s\n' "${line: -80}"; fi
              cat /tmp/b64.err
              exit 1
            fi
          done < bootstrap-source.tgz.b64
          echo '4d71f27d0399b1a422a7bd4fdce3703085daa39d67210207e790f5d1a86b5bda  /tmp/imwiki-source.tgz' | sha256sum -c -
          tar -xzf /tmp/imwiki-source.tgz -C .
          rm -f bootstrap-source.tgz.b64 .github/workflows/bootstrap.yml
      - name: Commit final repository source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete imWiki 0.2.0 platform'
          git push origin HEAD:feature/production-foundation

# This workflow is intentionally self-deleting after a successful source import.
