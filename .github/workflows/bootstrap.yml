name: Bootstrap final imWiki source

on:
  push:
    branches:
      - feature/production-foundation
    paths:
      - bootstrap-source.tgz.b64
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-foundation
          fetch-depth: 0
      - name: Verify and unpack final source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          data = ''.join(Path('bootstrap-source.tgz.b64').read_text().split())
          out = bytearray()
          start = 0
          i = 0
          while i < len(data):
              if data[i] == '=':
                  end = i + 1
                  if end < len(data) and data[end] == '=':
                      end += 1
                  segment = data[start:end]
                  out.extend(base64.b64decode(segment, validate=True))
                  start = end
                  i = end
                  continue
              i += 1
          if start < len(data):
              segment = data[start:]
              out.extend(base64.b64decode(segment, validate=True))
          Path('/tmp/imwiki-source.tgz').write_bytes(out)
          print(f'decoded {len(out)} bytes')
          PY
          echo '4d71f27d0399b1a422a7bd4fdce3703085daa39d67210207e790f5d1a86b5bda  /tmp/imwiki-source.tgz' | sha256sum -c -
          tar -xzf /tmp/imwiki-source.tgz -C .
          rm -f bootstrap-source.tgz.b64 .github/workflows/bootstrap.yml
      - name: Commit final repository source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete imWiki 0.2.0 platform'
          git push origin HEAD:feature/production-foundation

# This workflow is intentionally self-deleting after a successful source import.
