name: Bootstrap final imWiki source

on:
  push:
    branches:
      - feature/production-foundation
    paths:
      - source-parts/**
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-foundation
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import tarfile

          parts = [
              'source-parts/part00.b64',
              'source-parts/part01.b64',
              'source-parts/part02.b64',
              'source-parts/part03-04.b64',
              'source-parts/part05-06.b64',
              'source-parts/part07-08.b64',
              'source-parts/part09-10.b64',
              'source-parts/part-missing04.b64',
              'source-parts/part11-12.b64',
              'source-parts/tail00.b64',
              'source-parts/tail01.b64',
              'source-parts/tail02a.b64',
              'source-parts/tail02b.b64',
              'source-parts/tail03.b64',
              'source-parts/tail04.b64',
              'source-parts/tail05.b64',
              'source-parts/tail06.b64',
              'source-parts/tail07.b64',
              'source-parts/tail08.b64',
          ]

          encoded = ''.join(Path(name).read_text() for name in parts)
          if len(encoded) != 175480:
              raise SystemExit(f'Unexpected base64 length: {len(encoded)}')
          digest_b64 = hashlib.sha256(encoded.encode()).hexdigest()
          if digest_b64 != '245bbe4084954a73af833d089956279a3926b6f4ae59c68df8e7d44cf07b0b52':
              raise SystemExit(f'Base64 stream checksum mismatch: {digest_b64}')

          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != 'e5984a24ec7b238e754b2b85dae0f171c1d5ef8a7142e7bb8176bde2cf48b175':
              raise SystemExit(f'Archive checksum mismatch: {digest}')

          archive_path = Path('/tmp/imwiki-source-final.tgz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, 'r:gz') as tf:
              for member in tf.getmembers():
                  p = Path(member.name)
                  if p.is_absolute() or '..' in p.parts or member.issym() or member.islnk():
                      raise SystemExit(f'Unsafe archive member: {member.name}')
          print(f'Archive verified: {len(archive)} bytes, sha256={digest}')
          PY

      - name: Replace repository tree with verified source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar --no-same-owner --no-same-permissions -xzf /tmp/imwiki-source-final.tgz -C .
          test -f index.php
          test -f install.php
          test -f tests/run.php
          test -f .github/workflows/ci.yml
          test -f .github/workflows/release.yml

      - name: Validate imported source
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run.php
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/imwiki-workflows
          cp .github/workflows/ci.yml /tmp/imwiki-workflows/ci.yml
          cp .github/workflows/release.yml /tmp/imwiki-workflows/release.yml
          rm -rf .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete imWiki 0.2.0 platform'
          git push origin HEAD:feature/production-foundation
