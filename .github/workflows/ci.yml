name: CI

on:
  push:
    branches: [main, feature/production-foundation, feature/stage3-enterprise]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, fileinfo, session, zip
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Unit and security tests
        run: php tests/run.php
      - name: JSON integrity
        run: |
          php -r 'json_decode(file_get_contents("public/openapi.json"), true, 512, JSON_THROW_ON_ERROR); echo "OPENAPI_JSON_OK\n";'
      - name: JavaScript syntax
        run: node --check public/assets/app.js
      - name: Release integrity scan
        run: |
          ! grep -RInE 'localhost:[0-9]+|127\.0\.0\.1:[0-9]+|vite/client|unpkg\.com|cdn\.jsdelivr\.net' --exclude-dir=.git --exclude-dir=.github --exclude='*.md' .

  database:
    name: ${{ matrix.name }} migrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MariaDB 10.11
            image: mariadb:10.11
          - name: MySQL 8.0
            image: mysql:8.0
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MARIADB_DATABASE: imwiki_test
          MARIADB_USER: imwiki
          MARIADB_PASSWORD: imwiki
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: imwiki_test
          MYSQL_USER: imwiki
          MYSQL_PASSWORD: imwiki
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, session, zip
          coverage: none
      - name: Fresh migration install
        env: &db-env
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: imwiki_test
          TEST_DB_USER: imwiki
          TEST_DB_PASS: imwiki
        run: php tests/fresh_install.php
      - name: Stage 2 to Stage 3 upgrade
        env: *db-env
        run: php tests/upgrade.php
