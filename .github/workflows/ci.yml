name: CI

on:
  push:
    branches: [main, feature/production-foundation, feature/stage3-enterprise]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, fileinfo, session, zip
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Unit and security tests
        run: php tests/run.php
      - name: JSON integrity
        run: |
          php -r 'json_decode(file_get_contents("public/openapi.json"), true, 512, JSON_THROW_ON_ERROR); echo "OPENAPI_JSON_OK\n";'
      - name: JavaScript syntax
        run: node --check public/assets/app.js
      - name: Release integrity scan
        run: |
          ! grep -RInE 'localhost:[0-9]+|127\.0\.0\.1:[0-9]+|vite/client|unpkg\.com|cdn\.jsdelivr\.net' --exclude-dir=.git --exclude-dir=.github --exclude='*.md' .

  database:
    name: ${{ matrix.name }} migrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MariaDB 10.11
            image: mariadb:10.11
          - name: MySQL 8.0
            image: mysql:8.0
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MARIADB_DATABASE: imwiki_test
          MARIADB_USER: imwiki
          MARIADB_PASSWORD: imwiki
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: imwiki_test
          MYSQL_USER: imwiki
          MYSQL_PASSWORD: imwiki
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, session, zip
          coverage: none
      - name: Fresh migration install
        env: &db-env
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: imwiki_test
          TEST_DB_USER: imwiki
          TEST_DB_PASS: imwiki
        run: php tests/fresh_install.php
      - name: Stage 2 to Stage 3 upgrade
        env: *db-env
        run: php tests/upgrade.php

  release-smoke:
    name: Final release ZIP browser smoke
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: imwiki_smoke
          MARIADB_USER: imwiki
          MARIADB_PASSWORD: imwiki
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, session, zip, curl
          coverage: none
      - name: Build exact production ZIP layout
        run: |
          set -euo pipefail
          rm -rf /tmp/imwiki-package /tmp/imwiki-release imwiki-ci.zip
          mkdir -p /tmp/imwiki-package /tmp/imwiki-release
          rsync -a ./ /tmp/imwiki-package/ \
            --exclude='.git/' --exclude='.github/' --exclude='tests/' \
            --exclude='config/config.php' --exclude='storage/installed.lock' \
            --exclude='storage/logs/*' --exclude='storage/cache/*' \
            --exclude='storage/private/*' --exclude='storage/uploads/*'
          (cd /tmp/imwiki-package && zip -qr "$GITHUB_WORKSPACE/imwiki-ci.zip" .)
          unzip -q imwiki-ci.zip -d /tmp/imwiki-release
          test -f /tmp/imwiki-release/install.php
          test ! -e /tmp/imwiki-release/tests
          test ! -e /tmp/imwiki-release/config/config.php
          test ! -e /tmp/imwiki-release/storage/installed.lock
      - name: Start release artifact over HTTP
        env:
          SMOKE_DOCROOT: /tmp/imwiki-release
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18080 -t /tmp/imwiki-release tests/http_router.php >/tmp/imwiki-smoke-server.log 2>&1 &
          echo $! >/tmp/imwiki-smoke-server.pid
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:18080/install.php?step=1' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/imwiki-smoke-server.log
          exit 1
      - name: Browser-only install and application smoke
        env:
          SMOKE_DB_HOST: 127.0.0.1
          SMOKE_DB_PORT: 3306
          SMOKE_DB_NAME: imwiki_smoke
          SMOKE_DB_USER: imwiki
          SMOKE_DB_PASS: imwiki
          SMOKE_ADMIN_PASSWORD: Release-Smoke-Only-12345!
        run: php tests/release_artifact_smoke.php /tmp/imwiki-release http://127.0.0.1:18080
      - name: Server diagnostics on failure
        if: failure()
        run: cat /tmp/imwiki-smoke-server.log || true
      - name: Stop test server
        if: always()
        run: test ! -f /tmp/imwiki-smoke-server.pid || kill "$(cat /tmp/imwiki-smoke-server.pid)" || true
